<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OmenRF Spectrum</title><style>
:root{color-scheme:dark;--bg:#080b0d;--panel:#11171a;--grid:#263136;--green:#67f5b5;--amber:#ffc857;--muted:#8b9ba3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132529,#080b0d 44%);color:#e8f1f2;font:14px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #263136}h1{margin:0;font-size:20px;letter-spacing:.12em}.omen{color:var(--green)}.status{color:var(--muted)}main{padding:18px;display:grid;gap:14px}.toolbar,.card{background:#11171acc;border:1px solid #263136;border-radius:12px;padding:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#172126;border:1px solid #35464d;color:#e8f1f2;padding:8px 14px;border-radius:8px;cursor:pointer}button.active{border-color:var(--green);color:var(--green)}button.rec{border-color:#e45b5b;color:#ff8787}.metrics{display:flex;gap:24px;margin-left:auto}.metric b{display:block;font-size:19px;color:var(--amber)}canvas{width:100%;display:block;background:#090d0f;border-radius:8px}#trace{height:310px}#water{height:260px}.label{color:var(--muted);font-size:12px;margin:0 0 8px}.error{color:#ff8787}@media(max-width:700px){.metrics{width:100%;margin:8px 0 0}.metric{flex:1}header{padding:14px}main{padding:10px}}
</style></head><body><header><h1><span class="omen">OMEN</span>RF / SPECTRUM</h1><div class="status" id="status">Connecting…</div></header><main><div class="toolbar" id="toolbar"><span id="bands"></span><button id="record">Record</button><button id="reset">Reset peak</button><div class="metrics"><div class="metric">Peak<b id="peak">—</b></div><div class="metric">Noise floor<b id="noise">—</b></div><div class="metric">Sweeps<b id="count">0</b></div></div></div><section class="card"><p class="label">LIVE / AVERAGE / PEAK HOLD</p><canvas id="trace"></canvas></section><section class="card"><p class="label">WATERFALL — NEWEST AT TOP</p><canvas id="water"></canvas></section></main><script>
const T=document.querySelector('#trace'),W=document.querySelector('#water'),tc=T.getContext('2d'),wc=W.getContext('2d');let peak=[],avg=[],count=0,lastBand=-1,ranges=[];function fit(c){let d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!=w*d||c.height!=h*d){c.width=w*d;c.height=h*d;c.getContext('2d').setTransform(d,0,0,d,0,0)}}function color(v){let t=Math.max(0,Math.min(1,(v+105)/75));return `hsl(${200-t*200} 90% ${8+t*55}%)`}function draw(s){fit(T);fit(W);let v=s.values,w=T.clientWidth,h=T.clientHeight;if(s.band!=lastBand){peak=[];avg=[];count=0;wc.clearRect(0,0,W.clientWidth,W.clientHeight);lastBand=s.band}v.forEach((x,i)=>{peak[i]=peak[i]===undefined?x:Math.max(peak[i],x);avg[i]=avg[i]===undefined?x:avg[i]*.92+x*.08});tc.clearRect(0,0,w,h);tc.strokeStyle='#263136';tc.lineWidth=1;tc.font='11px system-ui';tc.fillStyle='#8b9ba3';for(let db=-100;db<=-20;db+=20){let y=( -10-db)/110*h;tc.beginPath();tc.moveTo(0,y);tc.lineTo(w,y);tc.stroke();tc.fillText(db+' dBm',6,y-4)}function line(a,c,l){tc.beginPath();a.forEach((x,i)=>{let X=i/(a.length-1)*w,Y=(-10-x)/110*h;i?tc.lineTo(X,Y):tc.moveTo(X,Y)});tc.strokeStyle=c;tc.lineWidth=l;tc.stroke()}line(peak,'#ffc857',1);line(avg,'#5d8b91',1.5);line(v,'#67f5b5',2);let img=wc.getImageData(0,0,W.width,W.height);wc.putImageData(img,0,devicePixelRatio||1);let bh=2;v.forEach((x,i)=>{wc.fillStyle=color(x);wc.fillRect(i/v.length*w,0,w/v.length+1,bh)});let mx=Math.max(...v),sorted=[...v].sort((a,b)=>a-b),nf=sorted[Math.floor(sorted.length*.25)];document.querySelector('#peak').textContent=mx+' dBm';document.querySelector('#noise').textContent=nf+' dBm';document.querySelector('#count').textContent=++count}
async function post(p){await fetch(p,{method:'POST'});if(p=='/api/reset')peak=[]}async function poll(){try{let x=await(await fetch('/api/state')).json();ranges=x.ranges;document.querySelector('#status').textContent=x.error?'ERROR: '+x.error:'DBx3 ONLINE';document.querySelector('#status').className=x.error?'status error':'status';if(!document.querySelector('#bands').children.length)x.ranges.forEach(r=>{let b=document.createElement('button');b.textContent=r.name;b.onclick=()=>post('/api/band/'+r.id);document.querySelector('#bands').append(b)});[...document.querySelector('#bands').children].forEach((b,i)=>b.classList.toggle('active',i==x.band));document.querySelector('#record').classList.toggle('rec',x.recording);if(x.latest&&x.latest.ts!=(window.ts||0)){window.ts=x.latest.ts;draw(x.latest)}}catch(e){document.querySelector('#status').textContent='OFFLINE'}setTimeout(poll,200)}document.querySelector('#record').onclick=()=>post('/api/record');document.querySelector('#reset').onclick=()=>post('/api/reset');poll();
</script></body></html>
