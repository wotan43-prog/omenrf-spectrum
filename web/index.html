<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OmenRF Spectrum</title><style>
:root{color-scheme:dark;--bg:#080b0d;--panel:#11171a;--grid:#263136;--green:#67f5b5;--amber:#ffc857;--muted:#8b9ba3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132529,#080b0d 44%);color:#e8f1f2;font:14px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #263136}h1{margin:0;font-size:20px;letter-spacing:.12em}.omen{color:var(--green)}.status{color:var(--muted)}main{padding:18px;display:grid;gap:14px}.toolbar,.card,.channels{background:#11171acc;border:1px solid #263136;border-radius:12px;padding:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#172126;border:1px solid #35464d;color:#e8f1f2;padding:8px 14px;border-radius:8px;cursor:pointer}button.active{border-color:var(--green);color:var(--green)}button.rec{border-color:#e45b5b;color:#ff8787;background:#351b1d}.metrics{display:flex;gap:24px;margin-left:auto}.metric b{display:block;font-size:19px;color:var(--amber)}canvas{width:100%;display:block;background:#090d0f;border-radius:8px}#trace{height:330px;cursor:crosshair}#water{height:260px}.label{color:var(--muted);font-size:12px;margin:0 0 8px}.error{color:#ff8787}.channel-grid{display:flex;gap:8px;flex-wrap:wrap}.channel{min-width:96px;flex:1;background:#0a0f11;border:1px solid #263136;border-radius:8px;padding:8px}.channel span{color:var(--muted);font-size:11px}.channel b{float:right;color:var(--green)}#cursor{color:var(--amber);float:right}@media(max-width:700px){.metrics{width:100%;margin:8px 0 0}.metric{flex:1}header{padding:14px}main{padding:10px}}
</style></head><body><header><h1><span class="omen">OMEN</span>RF / SPECTRUM <small>v0.2</small></h1><div class="status" id="status">Connecting…</div></header><main><div class="toolbar" id="toolbar"><span id="bands"></span><button id="pause">Freeze</button><button id="record">Record</button><button id="reset">Reset peak</button><div class="metrics"><div class="metric">Peak<b id="peak">—</b></div><div class="metric">Noise floor<b id="noise">—</b></div><div class="metric">Sweeps<b id="count">0</b></div></div></div><section class="card"><p class="label">CURRENT <span style="color:#67f5b5">■</span> / AVERAGE <span style="color:#5d8b91">■</span> / PEAK HOLD <span style="color:#ffc857">■</span><span id="cursor">Move cursor over trace</span></p><canvas id="trace"></canvas></section><section class="channels"><p class="label">ESTIMATED CHANNEL OCCUPANCY &gt; −82 dBm</p><div class="channel-grid" id="channelGrid"></div></section><section class="card"><p class="label">WATERFALL — NEWEST AT TOP</p><canvas id="water"></canvas></section></main><script>
const T=document.querySelector('#trace'),W=document.querySelector('#water'),tc=T.getContext('2d'),wc=W.getContext('2d');let peak=[],avg=[],count=0,lastBand=-1,ranges=[],frozen=false,lastSweep=null,occ={};function fit(c){let d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!=w*d||c.height!=h*d){c.width=w*d;c.height=h*d;c.getContext('2d').setTransform(d,0,0,d,0,0)}}function color(v){let t=Math.max(0,Math.min(1,(v+105)/75));return `hsl(${200-t*200} 90% ${8+t*55}%)`}function wifiChannels(s){let a=[];if(s.start_mhz<3000){for(let ch=1;ch<=13;ch++){let c=2412+(ch-1)*5;if(c>=s.start_mhz&&c<=s.end_mhz)a.push({n:ch,c,w:20})}}else{for(let ch of [36,40,44,48,52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144,149,153,157,161,165]){let c=5000+ch*5;if(c>=s.start_mhz&&c<=s.end_mhz)a.push({n:ch,c,w:20})}}return a}function draw(s){lastSweep=s;fit(T);fit(W);let v=s.values,w=T.clientWidth,h=T.clientHeight,pad=28;if(s.band!=lastBand){peak=[];avg=[];occ={};count=0;wc.clearRect(0,0,W.clientWidth,W.clientHeight);lastBand=s.band}v.forEach((x,i)=>{peak[i]=peak[i]===undefined?x:Math.max(peak[i],x);avg[i]=avg[i]===undefined?x:avg[i]*.92+x*.08});tc.clearRect(0,0,w,h);tc.strokeStyle='#263136';tc.lineWidth=1;tc.font='11px system-ui';tc.fillStyle='#8b9ba3';for(let db=-100;db<=-20;db+=20){let y=(-10-db)/110*(h-pad);tc.beginPath();tc.moveTo(0,y);tc.lineTo(w,y);tc.stroke();tc.fillText(db+' dBm',6,y-4)}let chans=wifiChannels(s);for(let ch of chans){let x=(ch.c-s.start_mhz)/(s.end_mhz-s.start_mhz)*w;tc.strokeStyle='#1e3b3b';tc.beginPath();tc.moveTo(x,0);tc.lineTo(x,h-pad);tc.stroke();tc.fillStyle='#769096';tc.fillText(ch.n,x-6,h-7);let vals=v.filter((_,i)=>{let f=s.start_mhz+i/(v.length-1)*(s.end_mhz-s.start_mhz);return Math.abs(f-ch.c)<=ch.w/2});let instant=vals.filter(x=>x>-82).length/Math.max(1,vals.length)*100;occ[ch.n]=occ[ch.n]===undefined?instant:occ[ch.n]*.9+instant*.1}tc.fillStyle='#8b9ba3';for(let i=0;i<=4;i++){let f=s.start_mhz+(s.end_mhz-s.start_mhz)*i/4;tc.fillText(f.toFixed(0)+' MHz',Math.min(w-58,w*i/4+2),h-20)}function line(a,c,l){tc.beginPath();a.forEach((x,i)=>{let X=i/(a.length-1)*w,Y=(-10-x)/110*(h-pad);i?tc.lineTo(X,Y):tc.moveTo(X,Y)});tc.strokeStyle=c;tc.lineWidth=l;tc.stroke()}line(peak,'#ffc857',1);line(avg,'#5d8b91',1.5);line(v,'#67f5b5',2);let img=wc.getImageData(0,0,W.width,W.height);wc.putImageData(img,0,(devicePixelRatio||1)*2);v.forEach((x,i)=>{wc.fillStyle=color(x);wc.fillRect(i/v.length*w,0,w/v.length+1,2)});let mx=Math.max(...v),sorted=[...v].sort((a,b)=>a-b),nf=sorted[Math.floor(sorted.length*.25)];document.querySelector('#peak').textContent=mx+' dBm';document.querySelector('#noise').textContent=nf+' dBm';document.querySelector('#count').textContent=++count;document.querySelector('#channelGrid').innerHTML=chans.map(ch=>`<div class="channel"><span>Channel ${ch.n}</span><b>${Math.round(occ[ch.n])}%</b></div>`).join('')}
async function post(p){await fetch(p,{method:'POST'});if(p=='/api/reset')peak=[]}async function poll(){try{let x=await(await fetch('/api/state')).json();ranges=x.ranges;document.querySelector('#status').textContent=x.error?'ERROR: '+x.error:(x.recording?'● RECORDING':'DBx3 ONLINE');document.querySelector('#status').className=x.error?'status error':x.recording?'status error':'status';if(!document.querySelector('#bands').children.length)x.ranges.forEach(r=>{let b=document.createElement('button');b.textContent=r.name;b.onclick=()=>post('/api/band/'+r.id);document.querySelector('#bands').append(b)});[...document.querySelector('#bands').children].forEach((b,i)=>b.classList.toggle('active',i==x.band));document.querySelector('#record').classList.toggle('rec',x.recording);document.querySelector('#record').textContent=x.recording?'Stop recording':'Record';if(!frozen&&x.latest&&x.latest.ts!=(window.ts||0)){window.ts=x.latest.ts;draw(x.latest)}}catch(e){document.querySelector('#status').textContent='OFFLINE'}setTimeout(poll,200)}document.querySelector('#record').onclick=()=>post('/api/record');document.querySelector('#reset').onclick=()=>{peak=[];post('/api/reset')};document.querySelector('#pause').onclick=e=>{frozen=!frozen;e.target.textContent=frozen?'Resume':'Freeze';e.target.classList.toggle('active',frozen)};T.onmousemove=e=>{if(!lastSweep)return;let r=T.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),i=Math.round(p*(lastSweep.values.length-1)),f=lastSweep.start_mhz+p*(lastSweep.end_mhz-lastSweep.start_mhz);document.querySelector('#cursor').textContent=`${f.toFixed(2)} MHz  ${lastSweep.values[i]} dBm`};T.onmouseleave=()=>document.querySelector('#cursor').textContent='Move cursor over trace';poll();
</script></body></html>
